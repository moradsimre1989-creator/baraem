# ⚠️ هذا الملف موقوف عمداً خارج ‎.github/workflows/‎
# التوكن الحالي بلا صلاحية workflow فلا يستطيع رفع ملفات داخل ذلك المجلد.
# للتفعيل: gh auth refresh -s workflow ثم
#   mkdir -p .github/workflows && cp .github/pages-deploy.workflow.yml .github/workflows/deploy.yml
#   git add .github/workflows/deploy.yml && git commit -m "نشر تلقائي" && git push

# نشر موقع براعم تلقائياً على GitHub Pages
# ==========================================
# كل دفعة إلى main تبني الموقع وتنشره خلال دقيقة تقريباً، بلا أي خطوة يدوية.
# يمكن تشغيله يدوياً أيضاً من تبويب Actions عبر workflow_dispatch.

name: نشر براعم

on:
  push:
    branches: [main]
  workflow_dispatch:

# الصلاحيات التي يحتاجها النشر إلى Pages
permissions:
  contents: read
  pages: write
  id-token: write

# دفعة جديدة تُلغي بناءً جارياً بدل أن تصطفّ خلفه
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنماط
        run: npx oxlint src

      - name: البناء
        # المسار الفرعي لاسم المستودع — بدونه تنكسر كل روابط الأصول على Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: تجهيز صفحة 404
        # التطبيق صفحة واحدة بلا موجّه مسارات، لكن أي رابط خاطئ يجب أن يعيد
        # الطالب إلى التطبيق بدل صفحة خطأ GitHub البيضاء.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
