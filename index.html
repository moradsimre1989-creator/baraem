    <!--
      معاينة الرابط عند المشاركة (واتساب، فيسبوك، تيليجرام).

    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="براعم" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="براعم | وحدة الزيتونة" />

      property="og:description"
      content="رحلة تعليمية من التعرّف إلى شجرة الزيتون حتى الاختبار النهائي — للصفّين الثاني والثالث."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-cover.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شجرة زيتون معمّرة في بستان أخضر" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="رحلة تعليمية من التعرّف إلى شجرة الزيتون حتى الاختبار النهائي — للصفّين الثاني والثالث."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-cover.jpg" />

    <meta name="theme-color" content="#63b87c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
